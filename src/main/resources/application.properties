spring.application.name=springAI

# Ollama connection ? Spring AI's OllamaAutoConfiguration reads this
# prefix and, if OllamaApi is on the classpath, registers an
# OllamaChatModel bean automatically (conditional bean registration
# via @ConditionalOnClass / @ConditionalOnMissingBean).
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.7

# Actuator ? exposed now so you have /actuator/health from day one.
# Don't expose everything in prod; this is dev-safe.
management.endpoints.web.exposure.include=health,metrics,info