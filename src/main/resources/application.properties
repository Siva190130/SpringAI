spring.application.name=springAI

# Azure Foundry OpenAI v1 endpoint and deployment.
spring.ai.openai.base-url=${AZURE_OPENAI_BASE_URL}
spring.ai.openai.api-key=${AZURE_OPENAI_API_KEY}
spring.ai.openai.chat.model=${AZURE_OPENAI_DEPLOYMENT}
spring.ai.openai.chat.max-completion-tokens=4096
spring.ai.openai.chat.temperature=1
spring.ai.openai.chat.timeout=${AI_TIMEOUT:60s}
spring.ai.openai.chat.max-retries=${AI_MAX_RETRIES:0}

spring.threads.virtual.enabled=true
app.chat.max-concurrent-requests=${CHAT_MAX_CONCURRENT_REQUESTS:16}
app.chat.requests-per-minute=${CHAT_REQUESTS_PER_MINUTE:60}
app.chat.memory.max-sessions=${CHAT_MAX_SESSIONS:500}
app.chat.memory.max-turns=${CHAT_MEMORY_MAX_TURNS:10}
app.chat.memory.max-characters=${CHAT_MEMORY_MAX_CHARACTERS:64000}
app.chat.memory.idle-timeout=${CHAT_SESSION_IDLE_TIMEOUT:30m}
# Optional locally; required when the prod profile is active.
app.security.api-key=${CHAT_API_KEY:}

management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
